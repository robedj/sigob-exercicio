# Restringe a coleta do pytest à pasta de testes do projeto.
# (Evita que arquivos fora de tests/ — ex.: anotações locais — sejam coletados.)
[pytest]
testpaths = tests

# Coloca a raiz do projeto no sys.path, para que os testes possam fazer
# `from src import ingest` mesmo quando o pytest é chamado direto (`pytest`),
# e não como módulo (`python -m pytest`).
pythonpath = .
